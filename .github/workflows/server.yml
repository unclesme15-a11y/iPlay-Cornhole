name: server

on:
  push:
    branches: [main]
    paths: ['server/**', 'deploy/**', 'assets/**', 'docs/api-contract.md', 'docs/legal/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'deploy/**', 'assets/**', 'docs/api-contract.md', 'docs/legal/**', '.github/workflows/server.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    # A real Postgres, so the database code is tested on the same thing production uses
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cornhole_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cornhole_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Generated assets must be committed and current (the tests also check this)
      - run: npm run assets
      - run: git diff --exit-code -- ../assets
  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t iplay-cornhole-server server
      # The Hetzner deploy pack must stay valid
      - name: check deploy pack
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' .env
          docker compose config --quiet
          docker compose --profile proxy config --quiet
          for f in deploy.sh backup.sh restore.sh setup-host.sh; do bash -n "$f"; done
      # ...and must actually work: deploy, public pages, redeploy, backup, restore (as on the Hetzner box)
      - name: run the deploy pack for real
        working-directory: deploy
        run: |
          sed -i "s/^ADMIN_TOKEN=.*/ADMIN_TOKEN=$(openssl rand -hex 32)/" .env
          ./deploy.sh
          for p in /ready /api/meta /privacy /terms /support /delete-account; do curl -fsS -o /dev/null "http://127.0.0.1:3010$p"; done
          ./deploy.sh --no-build
          ./backup.sh
          echo RESTORE | ./restore.sh "$(ls -1t backups/*.dump | head -1)"
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3010/ready && break; sleep 1; done
          ./setup-host.sh --dry-run
      - name: logs if it failed
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 200
