# Already running nginx for your other iPlay games? Put this in /etc/nginx/sites-available/cornhole,
# link it into sites-enabled, get a certificate (`certbot --nginx -d cornhole.example.com`), and
# `nginx -t && systemctl reload nginx`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name cornhole.example.com;
    # certbot adds the https server block and this redirect for you
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cornhole.example.com;
    # ssl_certificate and ssl_certificate_key lines are added by certbot

    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        # WebSockets (a live match is one long connection)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A quiet match should not be cut off
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # During a deploy the game is away for a couple of seconds: try again instead of showing an error
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 5s;
    }
}
