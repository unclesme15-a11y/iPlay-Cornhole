# Already running nginx for your other iPlay games? Put this in /etc/nginx/sites-available/cornhole,
# link it into sites-enabled, then:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d cornhole.example.com
# certbot adds the https (port 443) part and the http-to-https redirect to this file for you.
# (Do not add "listen 443 ssl" by hand before you have a certificate: nginx refuses to start without one.)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name cornhole.example.com;

    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        # WebSockets (a live match is one long connection)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A quiet match should not be cut off
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_connect_timeout 5s;
        # During a deploy the game is away for about 2 seconds. Unlike Caddy, nginx does not hold requests
        # while it is away; the app retries and reconnects by itself, so players see "reconnecting" briefly.
    }
}
